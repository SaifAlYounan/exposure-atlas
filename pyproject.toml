[project]
name = "atlas"
version = "0.1.0"
description = "Exposure Atlas evidence kernel (G1)"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.23.0",
  "pyyaml==6.0.2",
  "pymupdf==1.24.10",
  "sqlalchemy==2.0.35",
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/python/atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["packages/python", "tools", "."]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
